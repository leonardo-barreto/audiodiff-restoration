#Training configuration file
exp_name: "train_check" #name of the experiment
model_dir: None #directory where the model will be saved locally

  #main options
#related to optimization
optimizer:
  _target_: "torch.optim.Adam"
  lr: 1e-4 #            help='Learning rate',
  betas: [0.9, 0.999]
  eps: 1e-8 #for numerical stability, we may need to modify it if usinf fp16
  
lr_rampup_it: 10000 #,  help='Learning rate rampup duration'

# Training related.
# CQTDiff                       = 3,280,000s of audio (3s   x 4 per batch x   320,000 iterations)
# Bernardo (CQTDiff-MAESTRO)    = 3,280,000s of audio (1.5s x 1 per batch x 2,560,000 iterations)
# MR-CQTDiff-MAESTRO            = 3,280,000s of audio (1.5s x 2 per batch x 1,280,000 iterations)
batch_size: 2 #         help='Total batch size'
max_iters: 1280000

# Performance-related.
num_workers: 4  #',       help='DataLoader worker processes', metavar='INT',                 type=click.IntRange(min=1), default=1, show_default=True)

# I/O-related. moved to logging
seed: 42 # random seed

# Resume from checkpoint
resume: False
resume_checkpoint: /home/leonardo.barreto/Documents/pesquisa/mestrado/audiodiff-restoration-project/code/mr-cqtdiff/src/experiments/MR-cqtdiff_44k_1_5s_maestro/train_check-49000.pt

#audio data related
sample_rate: 44100
audio_len: 65536

#EMA of weights
ema_rate: 0.9999
# Total audio duration during ramp-up = ema_rampup * (load_len*batch_size)
# Defaults by Moliner: 10000 * (6*4) = 240000 (ema_rampup = 10000)
ema_rampup: 80000  #1.5s and batch_size = 2


#gradient clipping
use_grad_clip: True
max_grad_norm: 1

restore : False
checkpoint_id: None


