#Training configuration file
exp_name: "MAESTRO_44k_1_5s" #name of the experiment
model_dir: sanity_check #directory where the model will be saved locally

  #main options
#related to optimization
optimizer:
  _target_: "torch.optim.Adam"
  lr: 1e-4 #            help='Learning rate',
  betas: [0.9, 0.999]
  eps: 1e-8 #for numerical stability, we may need to modify it if usinf fp16
  

lr_rampup_it: 10000 #,  help='Learning rate rampup duration'

# Training related.
batch_size: 2 #         help='Total batch size'
max_iters: 4

# Performance-related.
num_workers: 4  #',       help='DataLoader worker processes', metavar='INT',                 type=click.IntRange(min=1), default=1, show_default=True)

# I/O-related. moved to logging
seed: 1 # random seed

# Resume from checkpoint
resume: True
#resume_checkpoint: None
resume_checkpoint: /home/leonardo.barreto/Documents/pesquisa/mestrado/audiodiff-restoration-project/code/mr-cqtdiff/src/experiments/MR-cqtdiff_44k_1_5s_maestro/MAESTRO_44k_1_5s-2.pt

#audio data related
sample_rate: 44100
audio_len: 65536


#ema_rate: "0.9999"  # comma-separated list of EMA values
ema_rate: 0.9999  #unused
ema_rampup: 10000  #linear rampup to ema_rate   #help='EMA half-life' 


#gradient clipping
use_grad_clip: True
max_grad_norm: 1

restore : False
checkpoint_id: None


